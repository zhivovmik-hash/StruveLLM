[package]
name = "struve-llm"
version = "0.8.2"
edition = "2021"
license = "MIT"
description = "Struve LLM desktop and persistent local controller"

[workspace]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance", "tauri/custom-protocol", "tauri/tray-icon"]

[dependencies]
chrono = "0.4"
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.2"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
crc32fast = "1"
tauri = { version = "2", optional = true, features = ["unstable"] }
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus","Win32_System_Performance","Win32_Storage_FileSystem"] }
windows = { version = "0.57", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[[bin]]
name = "struve-llm"
path = "src/main.rs"

[[bin]]
name = "struve-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[profile.release]
opt-level = 2
strip = true

